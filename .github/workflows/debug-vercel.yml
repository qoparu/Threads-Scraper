name: Debug Vercel link (one-off, no deploy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Real project/org IDs via API + compare to stored secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "--- Проект 'public' через API (настоящие id) ---"
          curl -s "https://api.vercel.com/v9/projects/public" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('id:', d.get('id')); print('accountId:', d.get('accountId'))"
          echo ""
          echo "--- Что хранится в секретах (длина, первые/последние символы, без утечки целиком) ---"
          echo "VERCEL_ORG_ID: len=${#VERCEL_ORG_ID} value=${VERCEL_ORG_ID:0:6}...${VERCEL_ORG_ID: -4}"
          echo "VERCEL_PROJECT_ID: len=${#VERCEL_PROJECT_ID} value=${VERCEL_PROJECT_ID:0:6}...${VERCEL_PROJECT_ID: -4}"
