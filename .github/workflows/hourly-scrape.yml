name: Hourly Threads scrape + dashboard deploy

on:
  # Встроенный GitHub-cron ненадёжен по времени (может задерживаться на часы или
  # пропускать срабатывание при нагрузке на GitHub). Вместо него внешний
  # будильник (cron-job.org) раз в час дёргает workflow_dispatch через API —
  # это единственный триггер, чтобы не было двойных/гоняющихся прогонов.
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "Быстрый режим: пересобрать дашборд из уже накопленного кэша и задеплоить, БЕЗ нового скрапинга Threads (~1-2 мин вместо 20-30)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # data/output/logs не в git (см. .gitignore) — переносим между запусками через cache,
      # иначе каждый прогон стартовал бы с чистого листа на свежем раннере.
      - name: Restore persistent state (corpus + AI caches)
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            output
            logs
          key: jaspulse-state-${{ github.run_id }}
          restore-keys: |
            jaspulse-state-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        if: github.event.inputs.rebuild_only != 'true'
        run: playwright install --with-deps chromium

      - name: Write secrets
        run: |
          cat > .env <<EOF
          LOG_LEVEL=INFO
          THREADS_COOKIE=${{ secrets.THREADS_COOKIE }}
          VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID=${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID=${{ secrets.VERCEL_PROJECT_ID }}
          LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
          LLM_MODEL=${{ secrets.LLM_MODEL }}
          EOF

      - name: Run hourly scrape + build + deploy
        if: github.event.inputs.rebuild_only != 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python run_hourly.py

      # Быстрый путь: без скрапинга, просто пересобрать public/index.html из уже
      # накопленных data/output и задеплоить — для проверки правок в коде дашборда.
      - name: Rebuild + deploy from cache only (fast mode)
        if: github.event.inputs.rebuild_only == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: python merge_and_deploy.py

      # always() — сохраняем прогресс, даже если сам прогон упал с ошибкой на середине.
      - name: Save persistent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            output
            logs
          key: jaspulse-state-${{ github.run_id }}
